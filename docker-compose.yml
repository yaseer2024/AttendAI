services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendai_backend
    restart: always
    volumes:
      - ./backend/data:/app/data
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attendai_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend